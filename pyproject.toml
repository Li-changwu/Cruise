[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ascend-resident-epoch"
version = "0.1.0"
description = "Cruise device-resident decode epoch prototype for vLLM-Ascend"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pytest>=7",
  "tokenizers>=0.21",
  "transformers>=4.51",
]

[project.entry-points."vllm.general_plugins"]
ascend_resident_epoch = "vllm_ascend_resident_epoch.plugin:register"

[project.scripts]
cruise = "vllm_ascend_resident_epoch.cli:main"
cruise-owner-serve = "vllm_ascend_persistent_owner.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_ascend_resident_epoch = ["compatibility.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
