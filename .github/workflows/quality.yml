name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: python -m pip install ".[test]"
      - name: Run dependency-light tests
        run: |
          python -m pytest -q \
            tests/test_abi_measurement.py \
            tests/test_contract.py \
            tests/test_engine_core_result_verifier.py \
            tests/test_multi_epoch_result_verifier.py \
            tests/test_productization_m0.py \
            tests/test_m1_batched_prefill.py \
            tests/test_m1_continuous_admission.py \
            tests/test_m1_exit.py \
            tests/test_m1_api.py \
            tests/test_persistent_control_p0.py \
            tests/test_persistent_recurrence_p1.py \
            tests/test_persistent_cancel_p2.py \
            tests/test_persistent_decoder_p3.py \
            tests/test_persistent_admission_p4.py \
            tests/test_persistent_decode_p5.py \
            tests/test_persistent_owner_graph_v2.py
      - name: Verify minimal ABI structure
        run: |
          python verify_minimal_abi_source.py . \
            --baseline-source history/attempts/vllm-integration-attempt73-multi-epoch-cohort
      - name: Audit repository payload
        run: python scripts/audit_repository.py
