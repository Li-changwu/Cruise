name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run dependency-light tests
        run: |
          python -m pytest -q \
            tests/test_abi_measurement.py \
            tests/test_contract.py \
            tests/test_engine_core_result_verifier.py \
            tests/test_multi_epoch_result_verifier.py
      - name: Verify minimal ABI structure
        run: |
          python verify_minimal_abi_source.py . \
            --baseline-source history/attempts/vllm-integration-attempt73-multi-epoch-cohort
      - name: Audit repository payload
        run: python scripts/audit_repository.py
